            <div>
                <h1 class="text-sm font-bold text-slate-800">අලි මුරුපද්‍යතිය</h1>

        <div class="flex items-center space-x-2 pointer-events-auto">
            <button class="bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-lg border border-slate-200 text-slate-700 font-medium text-sm flex items-center space-x-2 hover:bg-slate-50 active:scale-95 transition-all">

                        <h4 class="font-bold text-slate-800 text-sm mt-1">සිරිපාලමග</h4>
                        <p class="text-xs text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i> 2026/10/05 05:43 PM &bull; <span class="text-slate-700 font-medium">ගයාන්</span></p>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <button class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-emerald-50 hover:text-emerald-600 transition-colors">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                    <button class="w-9 h-9 rounded-xl bg-slate-100 text-red-500 flex items-center justify-center hover:bg-red-50 transition-colors">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>

        </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Leaflet Map centered in Sri Lanka
            const map = L.map('map', {
                zoomControl: false
            }).setView([7.8731, 80.7718], 8);

            // Add OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Custom HTML marker icon
            const customIcon = L.divIcon({
                className: 'custom-map-marker',
                html: '<div style="background-color: #ef4444; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;"><div style="background-color: white; width: 8px; height: 8px; border-radius: 50%;"></div></div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            // Marker location
            const markerLocation = [7.2906, 80.6337];
            const marker = L.marker(markerLocation, { icon: customIcon }).addTo(map);

            // Custom Popup Content HTML
            const popupContent = `
                <div class="p-1 min-w-[260px] text-slate-800 font-sans">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2.5">
                        <span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center space-x-1">
                            <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
                            <span>ස්ථානේ අවධානම්</span>
                        </span>
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">6.4 <i class="fa-solid fa-star text-[10px]"></i></span>
                    </div>

                    <div class="space-y-2 text-xs">
                        <div class="flex items-center justify-between text-slate-600">
                            <span class="flex items-center space-x-1.5"><i class="fa-solid fa-user text-slate-400"></i><span>වාර්තාකරු:</span></span>
                            <span class="font-bold text-slate-800">ගයාන්</span>
                        </div>
                        <div class="flex items-center justify-between text-slate-600">
                            <span class="flex items-center space-x-1.5"><i class="fa-regular fa-calendar text-slate-400"></i><span>දිනය/වේලාව:</span></span>
                            <span class="font-medium text-slate-800">2026/10/05 05:43 PM</span>
                        </div>
                    </div>

                    <div class="mt-3 pt-2.5 border-t border-slate-100 bg-amber-50/50 p-2.5 rounded-xl space-y-1.5">
                        <div class="font-bold text-xs text-slate-800 flex items-center space-x-1.5">
                            <i class="fa-solid fa-location-dot text-amber-600"></i>
                            <span>ස්ථානයේ විස්තරය</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-700">සිරිපාලමග</p>
                        <p class="text-[11px] text-slate-600"><span class="font-bold text-slate-700">අලි ගණන:</span> 1</p>
                    </div>

                    <div class="mt-2.5 bg-emerald-50/70 p-2 rounded-xl text-[11px] text-emerald-900 flex items-start space-x-2">
                        <i class="fa-solid fa-circle-info text-emerald-600 mt-0.5"></i>
                        <span>මේ පිහිටීමෙන් එක්ස්පර්ට් 26 min අතරි ඇත. තව 7 min වලින් පිහිටීමෙන් මැදි වී යයි.</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <button class="bg-sky-50 hover:bg-sky-100 text-sky-700 py-2 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5 transition-colors">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <span>වෙනස්</span>
                        </button>
                        <button class="bg-rose-50 hover:bg-rose-100 text-rose-700 py-2 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5 transition-colors">
                            <i class="fa-solid fa-trash"></i>
                            <span>මකන්න</span>
                        </button>
                    </div>
                </div>
            `;

            // Bind Leaflet Popup with closeButton enabled
            marker.bindPopup(popupContent, {
                closeButton: true,
                className: 'custom-leaflet-popup',
                maxWidth: 320,
                autoClose: false,
                closeOnClick: false
            });

            marker.openPopup();

            // When popup opens, disable click propagation so users can drag the map underneath the popup card
            marker.on('popupopen', (e) => {
                const popupContainer = e.popup.getElement();
                if (popupContainer) {
                    L.DomEvent.disableClickPropagation(popupContainer);
                    L.DomEvent.disableScrollPropagation(popupContainer);
                }
            });

            const bottomSheet = document.getElementById('bottomSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const sheetToggleBtn = document.getElementById('sheetToggleBtn');
            const sheetToggleIcon = document.getElementById('sheetToggleIcon');

            let isExpanded = false;

            function toggleBottomSheet(expand) {
                isExpanded = expand !== undefined ? expand : !isExpanded;
                if (isExpanded) {
                    bottomSheet.style.transform = 'translateY(0)';
                    sheetToggleIcon.className = 'fa-solid fa-chevron-down text-xs';
                    // When bottom sheet is pulled up/expanded, dismiss/close the popup form
                    if (marker.isPopupOpen()) {
                        marker.closePopup();
                    }
                } else {
                    bottomSheet.style.transform = 'translateY(calc(100% - 65px))';
                    sheetToggleIcon.className = 'fa-solid fa-chevron-up text-xs';
                }
            }

            // Initial sheet position (collapsed showing only header)
            bottomSheet.style.transform = 'translateY(calc(100% - 65px))';
            bottomSheet.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            sheetHeader.addEventListener('click', () => {
                toggleBottomSheet();
            });

            sheetToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleBottomSheet();
            });

            // Adjust map view to center nicely
            setTimeout(() => {
                map.setView(markerLocation, 12, { animate: true });
            }, 300);
        });
    </script>
