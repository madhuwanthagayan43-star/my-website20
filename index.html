<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මැප් සහ පොප්-අප් යෙදුම</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* පොප්-අප් එක සම්පූර්ණයෙන්ම pointer-events: none කර මැප් එකට ඩ්‍රැග් වීමට ඉඩ සැලසීම */
        .leaflet-popup {
            pointer-events: none !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            pointer-events: none !important;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease-in-out;
        }
        .leaflet-popup-content {
            pointer-events: none !important;
        }
        /* බටන් සහ ක්ලෝස් අයිකනය ක්ලික් කිරීමට හැකි වන පරිදි සකස් කිරීම */
        .leaflet-popup button, 
        .leaflet-container a.leaflet-popup-close-button {
            pointer-events: auto !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            color: #d9534f;
        }

        /* Full Screen Popup එක සඳහා CSS පන්තිය */
        .leaflet-popup-content-wrapper.fullscreen-popup {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 90vw !important;
            max-width: 400px !important;
            height: auto !important;
            max-height: 80vh !important;
            z-index: 9999 !important;
            pointer-events: auto !important;
        }
        .leaflet-popup-content-wrapper.fullscreen-popup .leaflet-popup-content {
            pointer-events: auto !important;
        }

        /* යටින් ඇති මෑත කාලීන වාර්තා Bottom Sheet එක */
        #bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }
        .sheet-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 16px;
        }
        .sheet-content {
            padding: 15px 20px;
            overflow-y: auto;
            display: none;
        }
        #bottom-sheet.expanded .sheet-content {
            display: block;
        }
    </style>
</head>
<body>

    <!-- සිතියම පෙන්වන ප්‍රදේශය -->
    <div id="map"></div>

    <!-- මෑත කාලීන වාර්තා Bottom Sheet එක -->
    <div id="bottom-sheet">
        <div class="sheet-header" onclick="toggleBottomSheet()">
            <span>🕒 මෑත කාලීන වාර්තා</span>
            <span id="toggle-icon">▲</span>
        </div>
        <div class="sheet-content">
            <p><strong>ස්ථානය:</strong> සිරිපාලගම</p>
            <p>දිනය: 2026/10/05 05:43 PM</p>
            <p>අලි ගණන: 1</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // සිතියම ආරම්භ කිරීම (ශ්‍රී ලංකාව මධ්‍ය කරමින්)
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8731, 80.7718], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // සිතියම මත පොයින්ට් එකක් එක් කිරීම
        const marker = L.marker([7.95, 80.85]).addTo(map);

        const popupContent = `
            <div id="popup-inner-box" style="min-width: 200px;">
                <h3 style="margin: 0 0 10px 0; color: #d9534f; font-size: 14px;">⚠️ ස්ථාන අවදානම්</h3>
                <p style="margin: 5px 0;"><strong>වාර්තාකරු:</strong> ගයාන්</p>
                <p style="margin: 5px 0;"><strong>දිනය/වේලාව:</strong> 2026/10/05 05:43 PM</p>
                <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
                <p style="margin: 5px 0;"><strong>ස්ථානයේ විස්තරය:</strong><br>සිරිපාලගම</p>
                <p style="margin: 5px 0;"><strong>අලි ගණන:</strong> 1</p>
                <div style="margin-top: 10px; display: flex; gap: 5px;">
                    <button style="flex: 1; padding: 6px; background: #f0f0f0; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">වෙනස්</button>
                    <button style="flex: 1; padding: 6px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">මකන්න</button>
                </div>
            </div>
        `;

        marker.bindPopup(popupContent, {
            autoPan: false
        });

        // පොප්-අප් එක විවෘත වූ පසු එකවරක් ක්ලික් කළ විට Full Screen වීමට සහ Drag කිරීමට සකස් කිරීම
        marker.on('popupopen', function(e) {
            const popup = e.popup;
            const wrapper = popup.getElement().querySelector('.leaflet-popup-content-wrapper');
            const innerBox = document.getElementById('popup-inner-box');

            let isDragging = false;
            let startX, startY;

            // ටච් එක ආරම්භ වන විට
            innerBox.addEventListener('touchstart', function(e) {
                isDragging = false;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            // ටච් කරමින් අඳින විට (Drag)
            innerBox.addEventListener('touchmove', function(e) {
                let moveX = e.touches[0].clientX;
                let moveY = e.touches[0].clientY;
                if (Math.abs(moveX - startX) > 10 || Math.abs(moveY - startY) > 10) {
                    isDragging = true; // ඩ්‍රැග් කරන බව තහවුරු වේ
                }
            }, { passive: true });

            // ටච් එක ඉවත් කළ විට (Tap / Click කිරීම)
            innerBox.addEventListener('touchend', function(e) {
                if (!isDragging) {
                    // ඩ්‍රැග් කර නැතිනම් එකවර ටච් කිරීමක් ලෙස සලකා Full Screen කිරීම
                    wrapper.classList.toggle('fullscreen-popup');
                }
            });
        });

        // Bottom Sheet එක ඉහළට/පහළට හැසිරවීම සහ පොප්-අප් එක වැසීම
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const icon = document.getElementById('toggle-icon');
            sheet.classList.toggle('expanded');
            
            if (sheet.classList.contains('expanded')) {
                icon.textContent = '▼';
                map.closePopup();
            } else {
                icon.textContent = '▲';
            }
        }
    </script>
</body>
</html>
