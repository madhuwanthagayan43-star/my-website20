<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මෑත කාලීන වාර්තා</title>
    <style>
        body {
            font-family: 'Iskoola Pota', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }
        .close-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .close-btn:hover {
            background-color: #ff1a1a;
        }
        .report-card {
            border: 1px solid #ffccd5;
            background-color: #fff5f5;
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }
        .badge {
            background-color: #ff4d4d;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            color: #b30000;
            margin-bottom: 8px;
        }
        .details {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ඉහළ කොටස සහ Close බටන් එක -->
        <div class="header">
            <h3>මෑත කාලීන වාර්තා</h3>
            <button class="close-btn" onclick="alert('Close clicked!')">×</button>
        </div>

        <!-- වාර්තා ශීට් එක -->
        <div class="report-card">
            <span class="badge">ඉහළ අවධානම්</span>
            <div class="title">සිරිපාලමාමා</div>
            <div class="details">🕒 2026/10/05 04:55 PM</div>
            <div class="details">👥 ළමයි 1 • <b>යාපන්</b></div>
        </div>
    </div>

</body>
</html>
