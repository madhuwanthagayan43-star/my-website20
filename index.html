<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අලි මුරපද්ධතිය - Elephant Watch</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #d32f2f;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. Sticky Header Bar at Top */
        .header-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Map Container */
        #map {
            height: 350px;
            width: 100%;
            z-index: 1;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* 2. Recent Reports Section Header */
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
        }

        .report-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border-left: 5px solid var(--primary-color);
        }

        .report-card.high-risk {
            border-left-color: var(--accent-color);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .report-location {
            font-weight: bold;
            font-size: 1rem;
            color: #222;
        }

        .report-time {
            font-size: 0.8rem;
            color: #666;
            background: #eef2f5;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .report-meta {
            font-size: 0.85rem;
            color: #555;
            display: flex;
            gap: 15px;
            margin-top: 6px;
        }

        /* 3. Map Popup & Comments UI */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 5px;
        }

        .popup-container {
            max-width: 280px;
        }

        .popup-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .popup-time {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
        }

        /* Scrollable Comments List */
        .comments-section {
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        .comments-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .comments-list {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .comments-list::-webkit-scrollbar {
            width: 4px;
        }

        .comments-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .comment-item {
            background: #f8f9fa;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .comment-author {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 2px;
        }

        .comment-text {
            color: #333;
            word-break: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .action-btn {
            color: #0066cc;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            font-size: 0.75rem;
        }

        .action-btn.delete {
            color: #d32f2f;
        }

        .add-comment-box {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .add-comment-box input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .add-comment-box button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Top Sticky Header Bar -->
    <div class="header-bar">
        <div class="header-title">
            <span>🐘</span> අලි මුරපද්ධතිය
        </div>
        <div class="user-badge">
            👤 <span id="currentUser">ගයාන්</span>
        </div>
    </div>

    <!-- Map View -->
    <div id="map"></div>

    <!-- Container for Nearby Reports sorted by distance -->
    <div class="container">
        <div class="section-title">
            ⏱️ මෑත කාලීන වාර්තා (ළඟම ඇති ස්ථාන අනුව)
        </div>
        <div id="reportsList"></div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const loggedUser = "ගයාන්";
        const userLocation = { lat: 7.8731, lng: 80.7718 }; // User Location

        let reports = [
            {
                id: 1,
                locationName: "තඹුත්තේගම - වැව් පාර",
                lat: 7.8750,
                lng: 80.7740,
                time: "05:08 AM",
                elephants: 2,
                risk: "ඉහළ අවදානම",
                comments: [
                    { id: 101, user: "කමල්", text: "වැව් පාර ළඟ අලියා ඉන්නවා දැක්කා." },
                    { id: 102, user: "ගයාන්", text: "පරිස්සමෙන් යන්න, දැන් පාර පනිනවා." }
                ]
            },
            {
                id: 2,
                locationName: "කලාවැව අබියස",
                lat: 7.9500,
                lng: 80.6500,
                time: "04:45 AM",
                elephants: 1,
                risk: "සාමාන්‍ය",
                comments: [
                    { id: 103, user: "නමල්", text: "කැලේ දෙසට ගියා." }
                ]
            }
        ];

        // Haversine formula to calculate distance
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Sort reports: closest location first
        function getSortedReports() {
            return [...reports].map(r => ({
                ...r,
                distance: getDistance(userLocation.lat, userLocation.lng, r.lat, r.lng)
            })).sort((a, b) => a.distance - b.distance);
        }

        // Initialize Map
        const map = L.map('map').setView([userLocation.lat, userLocation.lng], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // User Marker
        L.circleMarker([userLocation.lat, userLocation.lng], {
            radius: 8,
            color: '#1e88e5',
            fillColor: '#1e88e5',
            fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>ඔබ සිටින ස්ථානය</b>");

        // Render Map Markers & Auto-positioning Popups
        function renderMapMarkers() {
            getSortedReports().forEach(report => {
                const marker = L.marker([report.lat, report.lng]).addTo(map);
                marker.bindPopup(() => generatePopupHTML(report), {
                    autoPanPadding: [20, 70] // Prevents popup hiding behind sticky header
                });
            });
        }

        // Generate Popup content with Comment functionality
        function generatePopupHTML(report) {
            let commentsHTML = report.comments.map(c => {
                const isMyComment = (c.user === loggedUser);
                return `
                    <div class="comment-item">
                        <div class="comment-author">${c.user}</div>
                        <div class="comment-text">${c.text}</div>
                        ${isMyComment ? `
                            <div class="comment-actions">
                                <button class="action-btn" onclick="editComment(${report.id},${c.id})">සංස්කරණය</button>
                                <button class="action-btn delete" onclick="deleteComment(${report.id},${c.id})">මකන්න</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="popup-container">
                    <div class="popup-title">${report.locationName}</div>
                    <div class="popup-time">⏰ ${report.time} | 🐘 අලි: ${report.elephants}</div>
                    <div class="comments-section">
                        <div class="comments-title">අදහස් (Comments)</div>
                        <div class="comments-list">
                            ${commentsHTML}
                        </div>
                        <div class="add-comment-box">
                            <input type="text" id="input-${report.id}" placeholder="අදහසක් එක් කරන්න...">
                            <button onclick="addComment(${report.id})">යවන්න</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Recent Reports List
        function renderReportsList() {
            const listEl = document.getElementById('reportsList');
            const sorted = getSortedReports();
            listEl.innerHTML = sorted.map(r => `
                <div class="report-card ${r.risk === 'ඉහළ අවදානම' ? 'high-risk' : ''}">
                    <div class="report-header">
                        <div class="report-location">📍 ${r.locationName}</div>
                        <div class="report-time">⏰ ${r.time}</div>
                    </div>
                    <div class="report-meta">
                        <span>🐘 අලි: ${r.elephants}</span>
                        <span>⚠️ ${r.risk}</span>
                        <span>📏 දුර: ${r.distance.toFixed(1)} km</span>
                    </div>
                </div>
            `).join('');
        }

        // Comment Functions
        window.addComment = function(reportId) {
            const input = document.getElementById(`input-${reportId}`);
            if (!input.value.trim()) return;

            const report = reports.find(r => r.id === reportId);
            report.comments.push({
                id: Date.now(),
                user: loggedUser,
                text: input.value.trim()
            });

            input.value = '';
            renderReportsList();
            map.closePopup();
        };

        window.editComment = function(reportId, commentId) {
            const report = reports.find(r => r.id === reportId);
            const comment = report.comments.find(c => c.id === commentId);
            const newText = prompt("ඔබගේ අදහස වෙනස් කරන්න:", comment.text);
            if (newText !== null && newText.trim() !== "") {
                comment.text = newText.trim();
                renderReportsList();
                map.closePopup();
            }
        };

        window.deleteComment = function(reportId, commentId) {
            if (confirm("මෙම අදහස මකා දැමීමට අවශ්‍යද?")) {
                const report = reports.find(r => r.id === reportId);
                report.comments = report.comments.filter(c => c.id !== commentId);
                renderReportsList();
                map.closePopup();
            }
        };

        // Initial Execution
        renderReportsList();
        renderMapMarkers();
    </script>
</body>
</html>
