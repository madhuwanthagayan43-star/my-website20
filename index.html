```html
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මැප් සහ පොප්-අප් යෙදුම</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* CRITICAL: පොප්-අප් එක හරහා මැප් එක Drag කිරීමට හැකි වන සේ pointer-events සැකසීම */
        .leaflet-popup {
            pointer-events: none !important;
        }
        .leaflet-popup-content-wrapper {
            pointer-events: none !important;
            background: transparent;
            box-shadow: none;
            padding: 0;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            pointer-events: none !important;
        }
        .leaflet-popup-tip-container {
            display: none !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            pointer-events: auto !important;
            color: #d9534f;
            z-index: 10;
        }

        /* Bottom Sheet Styles */
        #bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }
        .sheet-content {
            display: none;
        }
        #bottom-sheet.expanded .sheet-content {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- සිතියම පෙන්වන ප්‍රදේශය -->
    <div id="map"></div>

    <!-- මෑත කාලීන වාර්තා Bottom Sheet එක -->
    <div id="bottom-sheet">
        <div class="p-4 flex justify-between items-center cursor-pointer border-b border-gray-200 font-bold text-gray-800" onclick="toggleBottomSheet()">
            <span class="flex items-center gap-2">🕒 මෑත කාලීන වාර්තා</span>
            <span id="toggle-icon" class="text-lg">▲</span>
        </div>
        <div class="sheet-content p-4 overflow-y-auto">
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <p class="text-sm font-semibold text-red-600 mb-1">ස්ථානය: සිරිපාලගම</p>
                <p class="text-xs text-gray-600">දිනය: 2026/10/05 05:43 PM</p>
                <p class="text-xs text-gray-600">අලි ගණන: 1</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8731, 80.7718], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // සිතියම මත පොයින්ට් එකක් එක් කිරීම
        const marker = L.marker([7.95, 80.85]).addTo(map);

        // පොප්-අප් ෆෝම් එකේ අන්තර්ගතය (බටන් සහ ලින්ක් පමණක් pointer-events: auto කර ඇත)
        const popupContent = `
            <div style="pointer-events: auto !important;" class="bg-white p-4 rounded-xl shadow-xl border border-gray-200 w-64">
                <h3 class="font-bold text-red-600 text-sm mb-2">⚠️ ස්ථාන අවදානම්</h3>
                <p class="text-xs text-gray-700 mb-1"><strong>වාර්තාකරු:</strong> ගයාන්</p>
                <p class="text-xs text-gray-700 mb-1"><strong>දිනය/වේලාව:</strong> 2026/10/05 05:43 PM</p>
                <hr class="my-2 border-gray-200">
                <p class="text-xs text-gray-700 mb-1"><strong>ස්ථානයේ විස්තරය:</strong> සිරිපාලගම</p>
                <p class="text-xs text-gray-700 mb-2"><strong>අලි ගණන:</strong> 1</p>
                <div class="flex gap-2 mt-3">
                    <button onclick="alertAction('වෙනස්')" class="flex-1 py-1.5 bg-gray-100 hover:bg-gray-200 text-xs font-semibold text-gray-700 rounded transition">වෙනස්</button>
                    <button onclick="alertAction('මකන්න')" class="flex-1 py-1.5 bg-red-600 hover:bg-red-700 text-xs font-semibold text-white rounded transition">මකන්න</button>
                </div>
            </div>
        `;

        marker.bindPopup(popupContent, {
            closeButton: true,
            autoClose: false,
            className: 'custom-popup'
        });

        // පොප්-අප් එක විවෘත වූ පසු අවශ්‍ය ඉවෙන්ට්ස් පාලනය
        marker.on('popupopen', function(e) {
            const popupContainer = e.popup.getElement();
            if (popupContainer) {
                L.DomEvent.disableClickPropagation(popupContainer);
                L.DomEvent.disableScrollPropagation(popupContainer);
            }
        });

        // බොත්තම් ක්‍රියාකාරිත්වය සඳහා (අවශ්‍ය පරිදි වෙනස් කරගත හැක)
        function alertAction(actionType) {
            console.log(actionType + " ක්ලික් කරන ලදී.");
        }

        // Bottom Sheet එක ඉහළට/පහළට හැසිරවීම සහ පොප්-අප් එක වැසීම
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const icon = document.getElementById('toggle-icon');
            sheet.classList.toggle('expanded');
            
            if (sheet.classList.contains('expanded')) {
                icon.textContent = '▼';
                // මෑත කාලීන වාර්තා ඉහළට ගත් විට පොප්-අප් එක ස්වයංක්‍රීයව වැසී යාමට
                map.closePopup();
            } else {
                icon.textContent = '▲';
            }
        }
    </script>
</body>
</html>
```
