<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ගමේ අලි මුරපද්ධතිය (Elephant Watch)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans Sinhala"', 'sans-serif'] },
                    colors: { brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
                }
            }
        }
    </script>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #1a1a1a; height: 100dvh; width: 100vw; 
        }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 10; }
        .ui-layer { position: absolute; z-index: 40; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        .leaflet-popup-pane { z-index: 1000 !important; }
        .leaflet-control-container { z-index: 60 !important; }
        .leaflet-popup { pointer-events: none !important; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            pointer-events: auto !important; border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); padding: 0; overflow: hidden; background: #fff;
        }
        .leaflet-popup-content { pointer-events: auto !important; margin: 0; width: 290px !important; }
        .leaflet-container a.leaflet-popup-close-button {
            pointer-events: auto !important; top: 8px; right: 8px; color: #666;
            background: rgba(255,255,255,0.8); border-radius: 50%; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .live-location-dot {
            width: 18px; height: 18px; background-color: #3b82f6; border-radius: 50%;
            border: 3px solid white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8); position: relative;
        }
        .live-location-dot::after {
            content: ""; position: absolute; top: -12px; left: -12px; right: -12px; bottom: -12px;
            border-radius: 50%; border: 2px solid rgba(59, 130, 246, 0.5); animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .temp-marker {
            color: #ef4444; font-size: 42px; animation: bounce 0.5s infinite alternate; text-shadow: 0 4px 6px rgba(0,0,0,0.6);
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-12px) scale(1.1); }
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #bottomSheet { transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sheet-normal { height: 38vh !important; min-height: 260px; max-height: 420px; transform: translateY(0) !important; }
        .sheet-fullscreen { height: 100dvh !important; min-height: 100dvh !important; max-height: 100dvh !important; transform: translateY(0) !important; border-radius: 0 !important; }
        .sheet-hidden { height: 38vh !important; transform: translateY(calc(100% - 56px)) !important; }
        #mainHeader { transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; }
        .header-hidden { transform: translateY(-150%); opacity: 0; pointer-events: none !important; }
    </style>
</head>
<body class="antialiased text-gray-800 font-sans flex flex-col">

    <div id="map"></div>

    <div class="ui-layer top-0 left-0 right-0 p-3 sm:p-4 flex flex-col gap-3">
        <!-- Header -->
        <header id="mainHeader" class="pointer-events-auto bg-white/90 backdrop-blur-xl rounded-2xl shadow-lg p-3 flex justify-between items-center border border-white/50">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-green-500 to-green-700 text-white p-2 rounded-xl w-12 h-12 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-elephant text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight text-gray-900">අලි මුරපද්ධතිය</h1>
                    <p class="text-[11px] text-gray-600 font-bold uppercase tracking-wide flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span> සජීවී සිතියම
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openNameChangeModal()" class="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 border border-gray-200 px-3 py-2 rounded-2xl text-xs font-bold text-gray-700 transition active:scale-95 shadow-sm">
                    <i class="fa-solid fa-circle-user text-green-600 text-base"></i>
                    <span id="displayUserName" class="max-w-[80px] truncate">...</span>
                </button>
                <button id="btnCenterMap" class="bg-blue-50 text-blue-600 w-12 h-12 rounded-2xl flex items-center justify-center hover:bg-blue-100 transition shadow-sm border border-blue-100 active:scale-95">
                    <i class="fa-solid fa-location-crosshairs text-xl"></i>
                </button>
            </div>
        </header>

        <!-- Alert Banner -->
        <div id="alertBanner" class="hidden pointer-events-auto bg-gradient-to-r from-red-600 to-red-700 text-white p-4 rounded-2xl shadow-xl border border-red-400 transition-all duration-500 transform -translate-y-4 opacity-0 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-white text-red-600 p-3 rounded-full flex items-center justify-center animate-bounce shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                </div>
                <div>
                    <strong class="block text-lg font-bold">අනතුරු ඇඟවීමයි!</strong>
                    <span id="alertMessage" class="text-sm font-medium text-red-50">...</span>
                </div>
            </div>
            <button onclick="hideAlert()" class="p-2 opacity-80 hover:opacity-100 bg-black/20 rounded-full w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
    </div>

    <div class="ui-layer bottom-0 left-0 right-0 flex flex-col pointer-events-none pb-safe">
        <div class="flex justify-end px-5 mb-5 pointer-events-none">
            <button id="btnReportCurrent" class="pointer-events-auto bg-gradient-to-r from-red-500 to-red-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-105 active:scale-95 transition-transform border-[3px] border-white" title="මගේ ස්ථානයෙන් වාර්තා කරන්න">
                <i class="fa-solid fa-bullseye"></i>
            </button>
        </div>

        <!-- Recent Reports Sheet -->
        <div id="bottomSheet" class="pointer-events-auto bg-white/95 backdrop-blur-2xl rounded-t-[32px] shadow-2xl border-t border-white/80 flex flex-col sheet-normal">
            <div id="dragHandle" class="w-full pt-3 pb-2 cursor-pointer select-none touch-none flex items-center justify-center">
                <div class="w-14 h-1.5 bg-gray-300 rounded-full"></div>
            </div>
            <div class="px-6 pb-3 flex justify-between items-center border-b border-gray-100/50">
                <h2 class="text-base font-bold text-gray-800 flex items-center gap-2 cursor-pointer" onclick="cycleBottomSheetState()">
                    <i class="fa-solid fa-clock-rotate-left text-green-600"></i> මෑත කාලීන වාර්තා
                </h2>
                <div class="flex items-center gap-2">
                    <span id="reportCountBadge" class="text-xs bg-green-100 text-green-800 border border-green-200 px-3 py-1 rounded-full font-bold">0</span>
                    <button onclick="cycleBottomSheetState()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition">
                        <i id="sheetToggleIcon" class="fa-solid fa-chevron-down text-xs"></i>
                    </button>
                </div>
            </div>
            
            <div id="reportsListContainer" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3 pb-6">
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-green-500"></i>
                    <span class="text-sm font-medium text-gray-500">දත්ත ලබාගනිමින්...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Name Input Modal -->
    <div id="nameModal" class="hidden fixed inset-0 z-[180] flex items-center justify-center bg-gray-900/80 backdrop-blur-md p-4 pointer-events-auto">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-6 shadow-2xl text-center border border-gray-100">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-user-check"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">සාදරයෙන් පිළිගනිමු!</h3>
            <p class="text-xs text-gray-500 font-medium mb-5">වාර්තා සහ අදහස් ඇතුළත් කිරීමට කරුණාකර ඔබගේ නම ඇතුළත් කරන්න.</p>
            <form onsubmit="saveUserName(event)" class="space-y-4">
                <input type="text" id="userNameInput" required placeholder="ඔබගේ නම..." class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none text-sm font-bold bg-gray-50 text-center">
                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-green-500 to-green-600 text-white font-bold shadow-lg active:scale-95 transition text-sm">ඉදිරියට යන්න</button>
            </form>
        </div>
    </div>

    <!-- Fullscreen Modal -->
    <div id="fullscreen-modal" class="hidden fixed inset-0 w-screen h-screen bg-white z-[99999] flex-col p-5 box-border pointer-events-auto">
        <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-4 pt-2">
            <h2 class="text-xl font-bold text-gray-900 m-0"><i class="fa-solid fa-circle-info text-blue-600 mr-2"></i>වාර්තා විස්තරය හා අදහස්</h2>
            <button class="bg-gray-100 text-gray-700 hover:bg-gray-200 border px-4 py-2 rounded-xl text-sm font-bold cursor-pointer transition active:scale-95 flex items-center" onclick="closeFullscreenModal()"><i class="fa-solid fa-xmark mr-1.5"></i> වසන්න</button>
        </div>
        <div id="fullscreen-modal-body" class="text-base leading-relaxed overflow-y-auto flex-1 custom-scroll pb-6"></div>
    </div>

    <!-- Report Action Modal -->
    <div id="reportModal" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center pointer-events-auto">
        <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm" onclick="closeModal('reportModal')"></div>
        <div id="reportModalContainer" class="bg-white w-full max-w-lg rounded-t-[32px] sm:rounded-[32px] shadow-2xl relative z-10 max-h-[calc(100dvh-20px)] flex flex-col">
            
            <div class="p-4 sm:p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-[32px]">
                <div>
                    <h3 id="modalTitle" class="text-lg sm:text-xl font-bold text-gray-900">නව වාර්තාවක්</h3>
                    <p class="text-xs text-gray-500 font-medium mt-0.5"><span id="modalDateTime"></span></p>
                </div>
                <button onclick="closeModal('reportModal')" class="w-8 h-8 bg-gray-200/80 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-300">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="p-4 sm:p-6 overflow-y-auto custom-scroll flex-1">
                <form id="elephantForm" class="space-y-4">
                    <input type="hidden" id="formId">
                    <input type="hidden" id="formLat">
                    <input type="hidden" id="formLng">
                    <input type="hidden" id="formImageBase64">

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1.5">ස්ථානයේ නම / විස්තරය</label>
                        <input type="text" id="formLocation" required placeholder="උදා: දියසේනපුර..." class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none bg-gray-50 text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1.5">අලි ගණන</label>
                            <input type="number" id="formCount" required min="1" value="1" class="w-full px-4 py-3 rounded-xl border border-gray-300 text-center font-bold text-lg bg-gray-50">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1.5">දිශාව (විකල්ප)</label>
                            <input type="text" id="formDirection" placeholder="ගම දෙසට" class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1.5">ඡායාරූපයක් (විකල්ප)</label>
                        <div class="relative w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center overflow-hidden cursor-pointer" onclick="openCameraModal()">
                            <div id="uploadPrompt" class="text-center">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-1"></i>
                                <p class="text-xs text-gray-600 font-bold">ඡායාරූපයක් තෝරන්න</p>
                            </div>
                            <img id="imagePreview" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                        </div>
                        <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="processImage(event)">
                        <div class="flex justify-end mt-1.5">
                            <button type="button" id="btnRemoveImg" class="hidden text-xs text-red-500 font-bold" onclick="removeImage()">ඉවත් කරන්න</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1.5">අවදානම් මට්ටම</label>
                        <div class="grid grid-cols-3 gap-2.5">
                            <label class="cursor-pointer">
                                <input type="radio" name="riskLvl" value="high" class="peer sr-only" checked>
                                <div class="text-center py-2 rounded-xl border-2 border-transparent bg-gray-100 peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700 font-bold text-xs">ඉහළ</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="riskLvl" value="medium" class="peer sr-only">
                                <div class="text-center py-2 rounded-xl border-2 border-transparent bg-gray-100 peer-checked:bg-orange-50 peer-checked:border-orange-500 peer-checked:text-orange-700 font-bold text-xs">මධ්‍යම</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="riskLvl" value="low" class="peer sr-only">
                                <div class="text-center py-2 rounded-xl border-2 border-transparent bg-gray-100 peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700 font-bold text-xs">අඩු</div>
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <div class="p-4 border-t border-gray-100 flex gap-3 bg-white rounded-b-[32px]">
                <button type="button" onclick="closeModal('reportModal')" class="flex-1 px-4 py-3 rounded-xl border border-gray-200 text-gray-700 font-bold text-sm">අවලංගුයි</button>
                <button type="submit" form="elephantForm" id="btnSubmit" class="flex-[2] px-4 py-3 rounded-xl bg-green-600 text-white font-bold shadow-lg text-sm flex items-center justify-center gap-2">වාර්තා කරන්න</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="hidden fixed inset-0 z-[999999] bg-black/90 flex items-center justify-center p-4 pointer-events-auto" onclick="closeLightbox()">
        <img id="lightboxImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl">
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 z-[150] flex items-center justify-center bg-gray-900/70 px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center">
            <h3 class="text-xl font-bold text-gray-900 mb-2">වාර්තාව මකන්නද?</h3>
            <div class="flex gap-3 mt-4">
                <button onclick="closeModal('deleteModal')" class="flex-1 px-4 py-3 rounded-xl border font-bold">නැහැ</button>
                <button id="confirmDeleteBtn" class="flex-1 px-4 py-3 rounded-xl bg-red-600 text-white font-bold">ඔව්, මකන්න</button>
            </div>
        </div>
    </div>

    <div id="toastArea" class="fixed top-20 left-0 right-0 flex flex-col items-center gap-2 z-[200] pointer-events-none px-4"></div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, query, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQiW0rOeuWwp3-h4ip37PcsUT-HoIhXg4",
            authDomain: "elipent-4e589.firebaseapp.com",
            projectId: "elipent-4e589",
            storageBucket: "elipent-4e589.firebasestorage.app",
            messagingSenderId: "363464948428",
            appId: "1:363464948428:web:e23f81df54b13003eee069"
        };

        let app, db, map, userMarker, tempMarker;
        let reportsData = [], mapMarkers = {}, targetDeleteId = null;
        let currentUserName = localStorage.getItem('elephantWatchUserName') || '';
        const EXPIRE_TIME_MS = 30 * 60 * 1000;
        let currentSheetState = 'normal';

        window.checkUserLogin = () => {
            if (!currentUserName) document.getElementById('nameModal').classList.remove('hidden');
            else { document.getElementById('nameModal').classList.add('hidden'); updateUserDisplay(); }
        };

        window.saveUserName = (e) => {
            e.preventDefault();
            const val = document.getElementById('userNameInput').value.trim();
            if (!val) return;
            currentUserName = val;
            localStorage.setItem('elephantWatchUserName', currentUserName);
            document.getElementById('nameModal').classList.add('hidden');
            updateUserDisplay();
            showToast(`ආයුබෝවන් ${currentUserName}!`);
        };

        window.openNameChangeModal = () => {
            document.getElementById('userNameInput').value = currentUserName;
            document.getElementById('nameModal').classList.remove('hidden');
        };

        function updateUserDisplay() {
            document.getElementById('displayUserName').innerText = currentUserName || 'නම එක්කරන්න';
        }

        window.showToast = (msg, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold flex items-center gap-3 border-l-4 ${type==='success'?'border-green-500':'border-red-500'}`;
            toast.innerHTML = `<span>${msg}</span>`;
            document.getElementById('toastArea').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        function initializeMap() {
            map = L.map('map', { zoomControl: false }).setView([7.8731, 80.7718], 8);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

            map.on('click', (e) => {
                if(tempMarker) map.removeLayer(tempMarker);
                const icon = L.divIcon({ className: '', html: `<div class="temp-marker" style="background:#22c55e; color:white; width:45px; height:45px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-elephant"></i></div>`, iconSize: [45, 45], iconAnchor: [22, 22] });
                tempMarker = L.marker(e.latlng, { icon }).addTo(map);
                openReportModal(null, e.latlng.lat, e.latlng.lng);
            });

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    if (!userMarker) {
                        const icon = L.divIcon({ className: '', html: '<div class="live-location-dot"></div>', iconSize:[18,18], iconAnchor:[9,9]});
                        userMarker = L.marker([latitude, longitude], { icon }).addTo(map);
                        map.setView([latitude, longitude], 15);
                    } else userMarker.setLatLng([latitude, longitude]);
                });
            }
        }

        async function connectFirebase() {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            onSnapshot(query(collection(db, 'reports')), (snapshot) => {
                let temp = [];
                const currentTime = Date.now();
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (!data.timestamp || (currentTime - data.timestamp < EXPIRE_TIME_MS)) {
                        temp.push({ id: docSnap.id, ...data });
                    }
                });
                reportsData = temp.sort((a, b) => b.timestamp - a.timestamp);
                refreshDataUI();
            });
        }

        // පරිශීලකයින්ගේ අදහස් (Comments) එකතු කිරීම සඳහා වන ක්‍රังก์ชันය
        window.addUserComment = async (reportId) => {
            if (!currentUserName) { openNameChangeModal(); return; }
            const inputEl = document.getElementById(`commentInput-${reportId}`);
            const text = inputEl.value.trim();
            if (!text) return;

            const newComment = {
                userName: currentUserName,
                text: text,
                timestamp: Date.now()
            };

            try {
                const reportRef = doc(db, 'reports', reportId);
                await updateDoc(reportRef, {
                    comments: arrayUnion(newComment)
                });
                inputEl.value = '';
                showToast("අදහස සාර්ථකව එකතු කරන ලදී!");
            } catch (err) {
                showToast("අදහස යැවීමේදී දෝෂයක් ඇතිවිය.", "error");
            }
        };

        function refreshDataUI() {
            document.getElementById('reportCountBadge').innerText = reportsData.length;
            let html = '';
            reportsData.forEach(item => {
                const commentsList = (item.comments || []).map(c => `
                    <div class="bg-gray-100 p-2 rounded-xl text-xs mb-1.5">
                        <span class="font-bold text-green-800">${c.userName}:</span> ${c.text}
                    </div>
                `).join('') || '<p class="text-[11px] text-gray-400 italic">තවම අදහස් කිහිපයක් නැත.</p>';

                const popupHtml = `
                    <div class="p-3.5 space-y-2 max-h-[300px] overflow-y-auto custom-scroll">
                        <h4 class="font-bold text-sm text-gray-900">${item.location}</h4>
                        <p class="text-xs text-gray-600">අලි ගණන: <b>${item.count}</b></p>
                        <div class="border-t pt-2 mt-2">
                            <span class="text-xs font-bold text-gray-700 block mb-1">ගම්වාසීන්ගේ අදහස්:</span>
                            <div class="max-h-28 overflow-y-auto space-y-1">${commentsList}</div>
                            <div class="flex gap-1 mt-2">
                                <input type="text" id="commentInput-${item.id}" placeholder="අදහසක් ලියන්න..." class="flex-1 px-2 py-1.5 border rounded-lg text-xs outline-none">
                                <button onclick="addUserComment('${item.id}')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">යවන්න</button>
                            </div>
                        </div>
                    </div>`;

                if (mapMarkers[item.id]) {
                    mapMarkers[item.id].getPopup().setContent(popupHtml);
                } else {
                    const marker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(popupHtml);
                    mapMarkers[item.id] = marker;
                }

                html += `<div class="bg-white rounded-2xl p-3 border shadow-sm"><h4 class="font-bold text-sm">${item.location}</h4><p class="text-xs text-gray-500">අලි ${item.count}</p></div>`;
            });
            if(reportsData.length === 0) document.getElementById('reportsListContainer').innerHTML = `<p class="text-center text-gray-400 py-10">වාර්තා නොමැත.</p>`;
            else document.getElementById('reportsListContainer').innerHTML = html;
        }

        window.openReportModal = (dataStr = null, lat = null, lng = null) => {
            if (!currentUserName) { openNameChangeModal(); return; }
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('formLat').value = lat;
            document.getElementById('formLng').value = lng;
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.closeFullscreenModal = () => document.getElementById('fullscreen-modal').classList.add('hidden');

        document.getElementById('elephantForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                location: document.getElementById('formLocation').value.trim(),
                count: parseInt(document.getElementById('formCount').value) || 1,
                risk: document.querySelector('input[name="riskLvl"]:checked').value,
                lat: parseFloat(document.getElementById('formLat').value),
                lng: parseFloat(document.getElementById('formLng').value),
                userName: currentUserName,
                timestamp: Date.now(),
                comments: []
            };
            await addDoc(collection(db, 'reports'), payload);
            closeModal('reportModal');
            showToast("වාර්තාව සාර්ථකව එකතු කළා.");
        });

        window.addEventListener('DOMContentLoaded', () => {
            checkUserLogin();
            initializeMap();
            connectFirebase();
        });
    </script>
</body>
</html>
