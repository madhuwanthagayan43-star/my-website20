<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>අලි මුරපද්ධතිය - Elephant Guard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Sinhala', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    #map { width: 100%; height: 100vh; z-index: 1; }

    /* Top Header */
    .top-header {
      position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
      padding: 12px 20px; border-radius: 20px; display: flex; align-items: center;
      justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .status-badge { width: 40px; height: 40px; background: #2e7d32; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header-text h2 { font-size: 18px; font-weight: 700; color: #111; }
    .header-text span { font-size: 12px; color: #666; display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; background: #ff5252; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .header-btns { display: flex; gap: 8px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #f0f2f5; color: #1976d2; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* Floating Add Button */
    .add-report-btn {
      position: absolute; bottom: 210px; right: 20px; z-index: 1000;
      width: 60px; height: 60px; background: #d32f2f; color: white; border-radius: 50%;
      border: 4px solid white; font-size: 28px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(211,47,47,0.4);
      transition: transform 0.2s;
    }
    .add-report-btn:active { transform: scale(0.95); }

    /* Bottom Sheet / Recent Reports */
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-radius: 25px 25px 0 0; padding: 15px 20px 20px 20px;
      max-height: 200px; box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
    }
    .sheet-handle { width: 40px; height: 5px; background: #ccc; border-radius: 3px; margin: 0 auto 10px auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-header h3 { font-size: 16px; font-weight: 700; color: #222; display: flex; align-items: center; gap: 8px; }
    .badge-count { background: #e8f5e9; color: #2e7d32; font-size: 13px; font-weight: bold; padding: 2px 10px; border-radius: 12px; }

    .reports-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .reports-scroll::-webkit-scrollbar { display: none; }
    .report-card {
      min-width: 260px; background: #f8f9fa; border: 1px solid #eee; border-left: 5px solid #d32f2f;
      border-radius: 15px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .card-left { display: flex; gap: 10px; align-items: center; }
    .card-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #eee; }
    .card-info h4 { font-size: 14px; color: #111; margin-bottom: 2px; }
    .card-info p { font-size: 11px; color: #666; }
    .card-risk { font-size: 11px; color: #d32f2f; background: #ffebee; padding: 2px 8px; border-radius: 6px; font-weight: 600; }

    /* Modal / New Report Form */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000;
      display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white; border-radius: 25px 25px 0 0; width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto; padding: 20px 24px; animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h2 { font-size: 20px; font-weight: 700; color: #111; }
    .close-btn { background: #f0f2f5; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: #555; }

    .form-group { margin-bottom: 15px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #2e7d32; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .form-control { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; background: #fafafa; }
    .form-control:focus { border-color: #2e7d32; background: white; }

    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .risk-options { display: flex; gap: 8px; }
    .risk-btn {
      flex: 1; padding: 10px; border: 1px solid #e0e0e0; border-radius: 10px; background: #f9f9f9;
      font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .risk-btn.active.high { background: #ffebee; border-color: #d32f2f; color: #d32f2f; }
    .risk-btn.active.medium { background: #fff8e1; border-color: #f57c00; color: #f57c00; }
    .risk-btn.active.low { background: #e8f5e9; border-color: #388e3c; color: #388e3c; }

    .upload-box {
      border: 2px dashed #ccc; border-radius: 15px; padding: 15px; text-align: center; background: #fafafa;
    }
    .file-opt-btn { background: #e8f5e9; color: #2e7d32; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin: 4px; }

    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-cancel { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 12px; background: white; font-size: 14px; font-weight: 600; color: #333; cursor: pointer; }
    .btn-submit { flex: 1; padding: 12px; border: none; border-radius: 12px; background: #2e7d32; font-size: 14px; font-weight: 600; color: white; cursor: pointer; }

    /* Map Popup Styling */
    .leaflet-popup-content-wrapper { border-radius: 20px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .leaflet-popup-content { margin: 10px 14px; min-width: 250px; max-width: 280px; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .popup-user { font-weight: 700; font-size: 16px; color: #111; display: flex; align-items: center; gap: 6px; }
    .popup-time { font-size: 11px; color: #888; }
    .popup-stats { display: flex; background: #f5f5f5; border-radius: 10px; padding: 8px; margin: 8px 0; justify-content: space-around; text-align: center; }
    .popup-stat-item h5 { font-size: 10px; color: #666; }
    .popup-stat-item span { font-size: 13px; font-weight: bold; color: #222; }
    .popup-img { width: 100%; max-height: 140px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; }
    .popup-expiry { font-size: 11px; color: #d32f2f; background: #ffebee; padding: 4px 8px; border-radius: 6px; text-align: center; font-weight: 600; margin-bottom: 8px; }

    /* Comments in Popup */
    .comments-section { border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; }
    .comments-title { font-size: 12px; font-weight: bold; color: #444; margin-bottom: 6px; }
    .comments-list { max-height: 100px; overflow-y: auto; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .comment-item { background: #f8f9fa; border-radius: 8px; padding: 6px 8px; font-size: 11px; }
    .comment-author { font-weight: bold; color: #2e7d32; margin-right: 5px; }
    .comment-actions { float: right; }
    .comment-actions span { cursor: pointer; color: #888; margin-left: 5px; font-size: 11px; }
    .comment-actions span:hover { color: #d32f2f; }

    .comment-input-group { display: flex; gap: 5px; }
    .comment-input-group input { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 11px; outline: none; }
    .comment-input-group button { background: #2e7d32; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    /* Pure Elephant Icon */
    .elephant-marker-icon { font-size: 32px; text-align: center; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.4)); }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-header">
    <div class="header-info">
      <div class="status-badge">🐘</div>
      <div class="header-text">
        <h2>අලි මුරපද්ධතිය</h2>
        <span><i class="dot"></i> සජීවී සිතියම</span>
      </div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="recenterBtn" title="මගේ ස්ථානය">🎯</button>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Add Button -->
  <button class="add-report-btn" id="openFormBtn">+</button>

  <!-- Bottom Sheet -->
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3><span>🔄</span> මෑත කාලීන වාර්තා</h3>
      <span class="badge-count" id="reportsCount">0</span>
    </div>
    <div class="reports-scroll" id="reportsList"></div>
  </div>

  <!-- Modal Form -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>නව වාර්තාවක්</h2>
        <button class="close-btn" id="closeFormBtn">&times;</button>
      </div>

      <p id="dateDisplay" style="font-size: 12px; color: #666; margin-bottom: 12px;"></p>

      <div class="form-group">
        <label>📍 ස්ථානයේ නම / විස්තරය</label>
        <input type="text" class="form-control" id="locDesc" placeholder="උදා: වැව් ඉවුර, 14 යාය...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>🔢 අලි ගණන</label>
          <input type="number" class="form-control" id="eCount" value="1" min="1">
        </div>
        <div class="form-group">
          <label>🧭 දිශාව (විකල්ප)</label>
          <input type="text" class="form-control" id="eDir" placeholder="ගම දෙසට...">
        </div>
      </div>

      <div class="form-group">
        <label>📷 ඡායාරූපයක් (විකල්ප)</label>
        <div class="upload-box">
          <p style="font-size:12px; color:#666;">ඡායාරූපයක් තෝරන්න</p>
          <button type="button" class="file-opt-btn" onclick="document.getElementById('fileCamera').click()">📷 කැමරාව</button>
          <button type="button" class="file-opt-btn" onclick="document.getElementById('fileGallery').click()">🖼️️ ගැලරිය</button>
          <input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(this)">
          <input type="file" id="fileGallery" accept="image/*" style="display:none;" onchange="handleImage(this)">
        </div>
        <img id="imgPreview" style="width:100%; height:120px; object-fit:cover; border-radius:10px; margin-top:8px; display:none;">
      </div>

      <div class="form-group">
        <label>⚠️ අවදානම් මට්ටම</label>
        <div class="risk-options">
          <div class="risk-btn active high" onclick="selectRisk(this, 'ඉහළ')">☢️ ඉහළ</div>
          <div class="risk-btn medium" onclick="selectRisk(this, 'මධ්‍යම')">❗️ මධ්‍යම</div>
          <div class="risk-btn low" onclick="selectRisk(this, 'අඩු')">🛡️ අඩු</div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelFormBtn">අවලංගුයි</button>
        <button type="button" class="btn-submit" id="saveReportBtn">🚀 වාර්තා කරන්න</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Username handling
    let currentUser = localStorage.getItem('ele_guard_username');
    if (!currentUser) {
      currentUser = "ගයාන්"; // පෙරනිමි නම
      localStorage.setItem('ele_guard_username', currentUser);
    }

    let currentPos = [7.8731, 80.7718]; 
    let selectedRisk = "ඉහළ";
    let selectedImageData = "";

    // Leaflet Map with Satellite & Labels Layer
    const map = L.map('map', { zoomControl: false }).setView(currentPos, 13);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

    const markersGroup = L.layerGroup().addTo(map);

    // Live Location
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        currentPos = [pos.coords.latitude, pos.coords.longitude];
        map.setView(currentPos, 14);
      });
    }

    document.getElementById('recenterBtn').onclick = () => map.setView(currentPos, 15);

    // Pure Elephant Icon
    const elephantIcon = L.divIcon({
      html: '<div class="elephant-marker-icon">🐘</div>',
      className: 'custom-elephant-icon',
      iconSize: [36, 36],
      iconAnchor: [18, 18],
      popupAnchor: [0, -18]
    });

    function getStoredReports() {
      const data = localStorage.getItem('ele_guard_reports');
      return data ? JSON.parse(data) : [];
    }

    function saveStoredReports(reports) {
      localStorage.setItem('ele_guard_reports', JSON.stringify(reports));
    }

    // Render Function (With 30-min Expiry logic)
    function renderReports() {
      const now = Date.now();
      const expiryMs = 30 * 60 * 1000; // 30 mins

      let reports = getStoredReports().filter(r => (now - r.timestamp) < expiryMs);
      saveStoredReports(reports);

      markersGroup.clearLayers();
      const reportsList = document.getElementById('reportsList');
      reportsList.innerHTML = '';
      document.getElementById('reportsCount').innerText = reports.length;

      reports.reverse().forEach((rep) => {
        const elapsed = now - rep.timestamp;
        const remainMins = Math.max(1, Math.ceil((expiryMs - elapsed) / 60000));

        const marker = L.marker([rep.lat, rep.lng], { icon: elephantIcon }).addTo(markersGroup);
        marker.bindPopup(createPopupHtml(rep, remainMins));

        const card = document.createElement('div');
        card.className = 'report-card';
        card.onclick = () => {
          map.setView([rep.lat, rep.lng], 16);
          marker.openPopup();
        };

        const displayImg = rep.image || 'https://via.placeholder.com/50?text=🐘';
        const formattedTime = new Date(rep.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        card.innerHTML = `
          <div class="card-left">
            <img src="${displayImg}" class="card-img">
            <div class="card-info">
              <h4>${rep.userName}</h4>
              <p>අලි: ${rep.count} | ${rep.locationName || 'ස්ථානය'}</p>
              <p style="font-size:10px; color:#888;">${formattedTime} (තව මිනි ${remainMins}යි)</p>
            </div>
          </div>
          <span class="card-risk">${rep.risk}</span>
        `;
        reportsList.appendChild(card);
      });
    }

    function createPopupHtml(rep, remainMins) {
      const dateStr = new Date(rep.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      let commentsHtml = '';
      if (rep.comments && rep.comments.length > 0) {
        rep.comments.forEach((c) => {
          const isMyComment = (c.user === currentUser);
          commentsHtml += `
            <div class="comment-item">
              <span class="comment-author">${c.user}:</span> ${c.text}
              ${isMyComment ? `
                <div class="comment-actions">
                  <span onclick="editComment('${rep.id}', '${c.id}')">✏️</span>
                  <span onclick="deleteComment('${rep.id}', '${c.id}')">🗑️</span>
                </div>
              ` : ''}
            </div>
          `;
        });
      } else {
        commentsHtml = '<p style="font-size:10px; color:#aaa; font-style:italic;">අදහස් නොමැත.</p>';
      }

      return `
        <div>
          <div class="popup-header">
            <span class="popup-user">🔴 ${rep.userName}</span>
            <span class="popup-time">${dateStr}</span>
          </div>

          <div class="popup-stats">
            <div class="popup-stat-item">
              <h5>අලි ගණන</h5>
              <span>${rep.count}</span>
            </div>
            <div class="popup-stat-item">
              <h5>දිශාව</h5>
              <span>${rep.direction || 'සඳහන් නැත'}</span>
            </div>
          </div>

          ${rep.locationName ? `<p style="font-size:11px; color:#444; margin-bottom:6px;"><b>විස්තරය:</b> ${rep.locationName}</p>` : ''}
          ${rep.image ? `<img src="${rep.image}" class="popup-img">` : ''}

          <div class="popup-expiry">⏳ තව මිනිත්තු ${remainMins}කින් මැකී යයි</div>

          <div class="comments-section">
            <div class="comments-title">💬 අදහස් (Comments)</div>
            <div class="comments-list">${commentsHtml}</div>
            <div class="comment-input-group">
              <input type="text" id="input-${rep.id}" placeholder="අදහසක් එක් කරන්න...">
              <button onclick="addComment('${rep.id}')">යවන්න</button>
            </div>
          </div>
        </div>
      `;
    }

    // Modal Events
    const modal = document.getElementById('reportModal');
    document.getElementById('openFormBtn').onclick = () => {
      document.getElementById('dateDisplay').innerText = `📅 ${new Date().toLocaleDateString()} - ${new Date().toLocaleTimeString()}`;
      modal.classList.add('active');
    };

    document.getElementById('closeFormBtn').onclick = () => modal.classList.remove('active');
    document.getElementById('cancelFormBtn').onclick = () => modal.classList.remove('active');

    function selectRisk(el, riskVal) {
      document.querySelectorAll('.risk-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      selectedRisk = riskVal;
    }

    function handleImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          selectedImageData = e.target.result;
          const preview = document.getElementById('imgPreview');
          preview.src = selectedImageData;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById('saveReportBtn').onclick = () => {
      const locName = document.getElementById('locDesc').value.trim();
      const count = document.getElementById('eCount').value || 1;
      const dir = document.getElementById('eDir').value.trim();

      const newReport = {
        id: 'rep_' + Date.now(),
        userName: currentUser,
        lat: currentPos[0] + (Math.random() - 0.5) * 0.003,
        lng: currentPos[1] + (Math.random() - 0.5) * 0.003,
        locationName: locName,
        count: count,
        direction: dir,
        risk: selectedRisk,
        image: selectedImageData,
        timestamp: Date.now(),
        comments: []
      };

      const reports = getStoredReports();
      reports.push(newReport);
      saveStoredReports(reports);

      document.getElementById('locDesc').value = '';
      document.getElementById('eDir').value = '';
      document.getElementById('imgPreview').style.display = 'none';
      selectedImageData = '';
      modal.classList.remove('active');

      renderReports();
    };

    // Comment Editing Logic
    window.addComment = function(reportId) {
      const inputEl = document.getElementById(`input-${reportId}`);
      const text = inputEl.value.trim();
      if (!text) return;

      const reports = getStoredReports();
      const report = reports.find(r => r.id === reportId);
      if (report) {
        if (!report.comments) report.comments = [];
        report.comments.push({
          id: 'com_' + Date.now(),
          user: currentUser,
          text: text,
          timestamp: Date.now()
        });
        saveStoredReports(reports);
        renderReports();
      }
    };

    window.editComment = function(reportId, commentId) {
      const reports = getStoredReports();
      const report = reports.find(r => r.id === reportId);
      if (report && report.comments) {
        const comment = report.comments.find(c => c.id === commentId);
        if (comment && comment.user === currentUser) {
          const newText = prompt("අදහස සංස්කරණය කරන්න:", comment.text);
          if (newText !== null && newText.trim() !== "") {
            comment.text = newText.trim();
            saveStoredReports(reports);
            renderReports();
          }
        }
      }
    };

    window.deleteComment = function(reportId, commentId) {
      if (!confirm("මෙම අදහස මකා දැමීමට අවශ්‍යද?")) return;
      const reports = getStoredReports();
      const report = reports.find(r => r.id === reportId);
      if (report && report.comments) {
        report.comments = report.comments.filter(c => !(c.id === commentId && c.user === currentUser));
        saveStoredReports(reports);
        renderReports();
      }
    };

    // Auto Refresh Expiry Every 10 Seconds
    setInterval(renderReports, 10000);
    renderReports();
  </script>
</body>
</html>
