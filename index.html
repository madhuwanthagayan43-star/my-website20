<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map & Bottom Sheet UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen relative overflow-hidden">

    <!-- සිතියම් ප්‍රදේශය (Map Area) -->
    <div class="w-full h-full bg-emerald-900 relative flex items-center justify-center">
        <p class="text-white text-lg font-semibold">සිතියම් දර්ශනය</p>

        <!-- පොප් අප් ෆෝම් එක (වාර්තාවක් ක්ලික් කළ විට පෙන්වීමට) -->
        <div id="popup-form" class="hidden absolute top-16 bg-white p-4 rounded-2xl shadow-xl w-80 z-20 border border-gray-200">
            <div class="flex justify-between items-center mb-2">
                <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded font-bold">අලි මුහුර්ධනය</span>
                <button onclick="closePopup()" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
            </div>
            <h3 class="font-bold text-gray-800 text-base">සිරිපාලමම</h3>
            <p class="text-xs text-gray-500 mt-1">දිනය: 2026/10/05 03:32 PM</p>
            <div class="mt-3 flex gap-2">
                <button class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg flex-1">වෙනස්</button>
                <button class="bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg flex-1">මකන්න</button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet එක -->
    <div id="bottom-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl transition-all duration-300 h-64 flex flex-col z-10">
        
        <!-- Header / ඊතලය සහිත බාර් එක -->
        <div class="flex items-center justify-between p-4 border-b border-gray-100 cursor-pointer select-none" onclick="toggleBottomSheet()">
            <div class="flex items-center gap-2">
                <span class="text-emerald-700 font-bold text-sm">🕒 මෑතකාලීන වාර්තා</span>
                <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full font-semibold">1</span>
            </div>
            <!-- ඊතල අයිකනය (උඩට/පහළට) -->
            <button id="arrow-btn" class="text-gray-500 text-xl font-bold transition-transform duration-300">⌃</button>
        </div>

        <!-- වාර්තා ලැයිස්තුව (ක්ලික් කළ විට පොප්-අප් පෙන්වා Bottom Sheet එක පල්ලෙහාට යයි) -->
        <div class="p-4 overflow-y-auto flex-1">
            <div onclick="selectReport()" class="bg-red-50 border border-red-200 rounded-2xl p-3 flex items-center justify-between cursor-pointer hover:bg-red-100 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500">🖼️</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-red-600 text-xs font-bold">🐘 හුලං අඩුවනම</span>
                            <span class="text-[10px] bg-red-200 text-red-800 px-1.5 py-0.5 rounded font-semibold">27m</span>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm">සිරිපාලමම</h4>
                        <p class="text-[11px] text-gray-500">2026/10/05 03:32 PM</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <span class="text-gray-400">✏️</span>
                    <span class="text-gray-400">🗑️</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ක්‍රියාකාරීත්වය -->
    <script>
        let isExpanded = false;

        // ඊතලය ක්ලික් කළ විට Bottom Sheet එක සම්පූර්ණ තිරයට (Full screen) හෝ සාමාන්‍ය තත්ත්වයට මාරු කිරීම
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const arrowBtn = document.getElementById('arrow-btn');
            
            isExpanded = !isExpanded;
            if (isExpanded) {
                sheet.classList.remove('h-64');
                sheet.classList.add('h-full', 'rounded-none');
                arrowBtn.innerText = '⌄'; // පහළට දිශාව පෙන්වන ඊතලය
            } else {
                sheet.classList.remove('h-full', 'rounded-none');
                sheet.classList.add('h-64');
                arrowBtn.innerText = '⌃'; // උඩට දිශාව පෙන්වන ඊතලය
            }
        }

        // මෑතකාලීන වාර්තාවක් ක්ලික් කළ විට ක්‍රියාත්මක වන කොටස
        function selectReport() {
            const popup = document.getElementById('popup-form');
            const sheet = document.getElementById('bottom-sheet');
            const arrowBtn = document.getElementById('arrow-btn');

            // 1. පොප් අප් ෆෝම් එක පෙන්වීම
            popup.classList.remove('hidden');
            
            // 2. Bottom Sheet එක Full Screen එකක පවතියි නම් එය සාමාන්‍ය/පහළ තත්ත්වයට (h-64) ගෙන ඒම
            isExpanded = false;
            sheet.classList.remove('h-full', 'rounded-none');
            sheet.classList.add('h-64');
            arrowBtn.innerText = '⌃';
        }

        // පොප්-අප් එක වසා දැමීම
        function closePopup() {
            document.getElementById('popup-form').classList.add('hidden');
        }
    </script>
</body>
</html>
