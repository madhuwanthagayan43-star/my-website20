<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මැප් සහ පොප්-අප් යෙදුම</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Leaflet popup container එක හරහා touch/mouse events මැප් එකට යාමට සැලසීම */
        .leaflet-popup {
            pointer-events: none !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            pointer-events: auto !important;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .leaflet-container a.leaflet-popup-close-button {
            pointer-events: auto !important;
            color: #d9534f;
        }

        /* යටින් ඇති මෑත කාලීන වාර්තා Bottom Sheet එක */
        #bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }
        .sheet-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 16px;
        }
        .sheet-content {
            padding: 15px 20px;
            overflow-y: auto;
            display: none;
        }
        #bottom-sheet.expanded .sheet-content {
            display: block;
        }
    </style>
</head>
<body>

    <!-- සිතියම පෙන්වන ප්‍රදේශය -->
    <div id="map"></div>

    <!-- මෑත කාලීන වාර්තා Bottom Sheet එක -->
    <div id="bottom-sheet">
        <div class="sheet-header" onclick="toggleBottomSheet()">
            <span>🕒 මෑත කාලීන වාර්තා</span>
            <span id="toggle-icon">▲</span>
        </div>
        <div class="sheet-content">
            <p><strong>ස්ථානය:</strong> සිරිපාලගම</p>
            <p>දිනය: 2026/10/05 05:43 PM</p>
            <p>අලි ගණන: 1</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // සිතියම ආරම්භ කිරීම (ශ්‍රී ලංකාව මධ්‍ය කරමින්)
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8731, 80.7718], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // සිතියම මත පොයින්ට් එකක් එක් කිරීම
        const marker = L.marker([7.95, 80.85]).addTo(map);

        const popupContent = `
            <div style="min-width: 200px;">
                <h3 style="margin: 0 0 10px 0; color: #d9534f; font-size: 14px;">⚠️ ස්ථාන අවදානම්</h3>
                <p style="margin: 5px 0;"><strong>වාර්තාකරු:</strong> ගයාන්</p>
                <p style="margin: 5px 0;"><strong>දිනය/වේලාව:</strong> 2026/10/05 05:43 PM</p>
                <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
                <p style="margin: 5px 0;"><strong>ස්ථානයේ විස්තරය:</strong><br>සිරිපාලගම</p>
                <p style="margin: 5px 0;"><strong>අලි ගණන:</strong> 1</p>
                <div style="margin-top: 10px; display: flex; gap: 5px;">
                    <button style="flex: 1; padding: 6px; background: #f0f0f0; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">වෙනස්</button>
                    <button style="flex: 1; padding: 6px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">මකන්න</button>
                </div>
            </div>
        `;

        marker.bindPopup(popupContent, {
            autoPan: false // පොප්-අප් එක විවෘත වන විට මැප් එක ස්වයංක්‍රීයව පෑන් වීම වැළැක්වීමට
        });

        // පොප්-අප් එක විවෘත වූ විට touch events map එකට pass වීමට අවශ්‍ය DOM listeners සැකසීම
        marker.on('popupopen', function(e) {
            const popupNode = e.popup.getElement();
            if (popupNode) {
                // Leaflet මඟින් default click/scroll block කිරීම නවතා, background map එකට drag වීමට ඉඩ සැලසීම
                L.DomEvent.disableScrollPropagation(popupNode);
                
                // Form එකේ හිස් තැන් වලදී drag කිරීමට map එකට touch events ලබා දීම
                popupNode.addEventListener('touchstart', function(event) {
                    if (event.target === popupNode || event.target.classList.contains('leaflet-popup-content') || event.target.tagName === 'DIV' && !event.target.closest('button')) {
                        // මෙහිදී touch එක map එක වෙත යොමු කරයි
                        map.dragging._enable();
                    }
                }, { passive: true });
            }
        });

        // Bottom Sheet එක ඉහළට/පහළට හැසිරවීම සහ පොප්-අප් එක වැසීම
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const icon = document.getElementById('toggle-icon');
            sheet.classList.toggle('expanded');
            
            if (sheet.classList.contains('expanded')) {
                icon.textContent = '▼';
                // මෑත කාලීන වාර්තා ඉහළට ගත් විට පොප්-අප් එක වැසී යාමට
                map.closePopup();
            } else {
                icon.textContent = '▲';
            }
        }
    </script>
</body>
</html>
