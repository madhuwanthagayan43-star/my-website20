<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ වෙබ් අඩවිය</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ---------------- Modal Overlay ---------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .modal-card h2 {
            color: #1a1a1a;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* ---------------- Main Content ---------------- */
        .main-container {
            display: none; /* ආරම්භයේදී සඟවා තබයි */
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .welcome-badge {
            background-color: #e7f1ff;
            color: #007bff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .main-container h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .user-name {
            color: #007bff;
        }

        .main-container p {
            color: #6c757d;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-reset {
            padding: 10px 20px;
            background-color: #f8f9fa;
            color: #dc3545;
            border: 1px solid #dc3545;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background-color: #dc3545;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. පළමු වරට පිවිසෙන විටUsername එක ලබාගන්නා Popup (Modal) එක -->
    <div id="usernameModal" class="modal-overlay">
        <div class="modal-card">
            <h2>සාදරයෙන් පිළිගනිමු! 👋</h2>
            <p>ඉදිරියට යාම සඳහා කරුණාකර ඔබගේ Username එක ඇතුළත් කරන්න.</p>
            
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="උදා: Supun_99" maxlength="20">
                <div id="errorMsg" class="error-msg">කරුණාකර වලංගු Username එකක් ඇතුළත් කරන්න!</div>
            </div>

            <button class="btn-submit" onclick="saveUsername()">සුරකින්න</button>
        </div>
    </div>

    <!-- 2. Username එක ඇතුළත් කළ පසු පෙනෙන ප්‍රධාන වෙබ් අඩවිය -->
    <div id="mainContent" class="main-container">
        <div class="welcome-badge">ලොග් වී ඇත</div>
        <h1>ආයුබෝවන්, <span id="displayUsername" class="user-name"></span>!</h1>
        <p>ඔබගේ Username එක මෙම ෆෝන් එකේ සාර්ථකව සුරැකිණි. නැවත පිටුවට පැමිණෙන විට Username එක නැවත ඇතුළත් කිරීමට අවශ්‍ය නොවේ.</p>
        
        <!-- Username එක වෙනස් කිරීමට හෝ Clear කිරීමට අවශ්‍ය නම් -->
        <button class="btn-reset" onclick="resetUsername()">Username එක ඉවත් කරන්න</button>
    </div>

    <script>
        // පිටුව Load වන විටම ක්‍රියාත්මක වන කොටස
        document.addEventListener("DOMContentLoaded", function() {
            checkSavedUser();
        });

        // ෆෝන් එකේ Username එක සුරැකී ඇත්දැයි පරීක්ෂා කිරීම
        function checkSavedUser() {
            const savedUsername = localStorage.getItem("device_username");

            if (savedUsername) {
                // Username එක සුරැකී ඇත්නම් කෙලින්ම ප්‍රධාන Content එක පෙන්වන්න
                document.getElementById("usernameModal").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
                document.getElementById("displayUsername").innerText = savedUsername;
            } else {
                // සුරැකී නැත්නම් Username ලබාගන්නා Modal එක පෙන්වන්න
                document.getElementById("usernameModal").style.display = "flex";
                document.getElementById("mainContent").style.display = "none";
            }
        }

        // Username එක Submit කරන විට ක්‍රියාත්මක වන ფუნქෂන් එක
        function saveUsername() {
            const inputField = document.getElementById("usernameInput");
            const username = inputField.value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (username !== "" && username.length >= 3) {
                errorMsg.style.display = "none";
                
                // ෆෝන් එකේ (Browser එකේ) localStorage හි Username එක සුරැකීම
                localStorage.setItem("device_username", username);
                
                // Screen එක Update කිරීම
                checkSavedUser();
            } else {
                errorMsg.innerText = "අවම වශයෙන් අකුරු 3ක Username එකක් ඇතුළත් කරන්න.";
                errorMsg.style.display = "block";
            }
        }

        // පරීක්ෂා කිරීම සඳහා Username එක Clear කිරීමේ ფუნქෂන් එක
        function resetUsername() {
            if (confirm("ඔබට මෙම ෆෝන් එකෙන් Username එක ඉවත් කිරීමට අවශ්‍යද?")) {
                localStorage.removeItem("device_username");
                location.reload(); // පිටුව Refresh කරයි
            }
        }
    </script>

</body>
</html>
