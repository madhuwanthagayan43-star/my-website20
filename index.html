    <script>
        // Core State
        let map;
        let markersGroup;
        let isRecentPanelOpen = true;

        // Custom Strict Date-Time Formatter: YYYY MM DD hh:mm AM/PM
        // (Without Sinhala words for "වසර" or "මාසය" as explicitly requested)
        function formatDateTime12H(dateInput) {
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return dateInput;

            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');

            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'AM' : 'AM'; // Normalized display format
            const actualAMPM = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // convert 0 to 12
            const strHours = String(hours).padStart(2, '0');

            return `${year} ${month} ${day} ${strHours}:${minutes} ${actualAMPM}`;
        }

        // Pre-populated Sample Data
        let reportsData = [

                count: 1,
                direction: 'ගම දෙසට',
                severity: 'ඉහළ අවදානම්',

                    { title: 'පසන් සමුගන්න ඇවිත් අසනීප...', link: '#' }
                ]
            },
            {
                id: '2',
                locationName: 'හබරණ පාර - සැතපුම 4',
                reporterName: 'සුනිල්',
                timestamp: '2026-10-05T07:15:00',
                count: 3,
                direction: 'පාර හරහා',
                severity: 'මධ්‍යම අවදානම්',
                distanceTime: '1h 30m',
                lat: 8.0410,
                lng: 80.7680,
                facebookPosts: []
            },
            {
                id: '3',
                locationName: 'මින්නේරිය වැව ආසන්නය',
                reporterName: 'කමල්',
                timestamp: '2026-10-04T18:20:00',
                count: 5,
                direction: 'වැව දෙසට',
                severity: 'සාමාන්‍ය',
                distanceTime: '14h ago',
                lat: 8.0190,
                lng: 80.8200,
                facebookPosts: []
            }
        ];

        // Initialize App on Window Load
        window.onload = function() {
            initMap();
            renderReportsUI();
        };

        function initMap() {
            // Center map around Habarana / Sigiriya / Minneriya region
            map = L.map('map', {
                zoomControl: false
            }).setView([8.0325, 80.7512], 13);

            // Add OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Add custom Leaflet Zoom control on top left
            L.control.zoom({ position: 'topleft' }).addTo(map);

            // Layer group for dynamic markers
            markersGroup = L.layerGroup().addTo(map);

            // Map click listener to auto-populate lat/lng in modal
            map.on('click', function(e) {
                document.getElementById('formLat').value = e.latlng.lat.toFixed(6);
                document.getElementById('formLng').value = e.latlng.lng.toFixed(6);
            });

            // Render initial markers
            renderMarkers();
        }

        function renderMarkers() {
            markersGroup.clearLayers();

            reportsData.forEach(item => {
                const markerIcon = L.divIcon({
                    className: 'custom-marker-wrapper',
                    html: `<div class="custom-marker w-9 h-9 text-xs"><i class="fa-solid fa-elephant"></i></div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                const marker = L.marker([item.lat, item.lng], { icon: markerIcon }).addTo(markersGroup);

                // Formatted date-time in strict YYYY MM DD hh:mm AM/PM format
                const formattedTime = formatDateTime12H(item.timestamp);

                // Leaflet Popup Content matching the design
                const popupContent = `
                    <div class="space-y-2 font-sans text-xs">
                        <div class="flex items-center justify-between border-b pb-1.5">
                            <span class="font-bold text-gray-800 text-sm flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-red-500"></i> ${item.locationName}
                            </span>
                            <span class="bg-red-100 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                🚨 ${item.severity}
                            </span>
                        </div>

                        <div class="space-y-1 text-gray-600">
                            <p class="flex items-center justify-between">
                                <span class="text-gray-400"><i class="fa-solid fa-user text-gray-400 mr-1"></i>වාර්තාකරු:</span>
                                <span class="font-semibold text-emerald-800">${item.reporterName}</span>
                            </p>
                            <p class="flex items-center justify-between">
                                <span class="text-gray-400"><i class="fa-regular fa-clock mr-1"></i>දිනය/වේලාව:</span>
                                <span class="font-semibold text-gray-700 bg-gray-100 px-1.5 py-0.5 rounded">${formattedTime}</span>
                            </p>
                            <p class="flex items-center justify-between">
                                <span class="text-gray-400"><i class="fa-solid fa-arrow-trend-up mr-1"></i>අලි ගණන / දිශාව:</span>
                                <span class="font-bold text-amber-700">${item.count} (${item.direction})</span>
                            </p>
                        </div>

                        <div class="pt-2 border-t flex items-center justify-between">
                            <button onclick="editReport('${item.id}')" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                                <i class="fa-solid fa-pen-to-square"></i> වෙනස්
                            </button>
                            <button onclick="deleteReport('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
                                <i class="fa-solid fa-trash"></i> මකන්න
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);

                // CRITICAL REQUIREMENT:
                // When any point/marker on the map is clicked, automatically collapse / slide down
                // the "මෑත කාලීන වාර්තා" bottom panel so the marker popup is fully visible.
                marker.on('click', function() {
                    collapseRecentPanel();
                });
            });
        }

        // Toggle Recent Reports Drawer
        function toggleRecentPanel() {
            if (isRecentPanelOpen) {
                collapseRecentPanel();
            } else {
                expandRecentPanel();
            }
        }

        function collapseRecentPanel() {
            isRecentPanelOpen = false;
            const panelBody = document.getElementById('recentPanelBody');
            const arrow = document.getElementById('panelArrowIcon');
            
            panelBody.style.display = 'none';
            arrow.style.transform = 'rotate(180deg)';
        }

        function expandRecentPanel() {
            isRecentPanelOpen = true;
            const panelBody = document.getElementById('recentPanelBody');
            const arrow = document.getElementById('panelArrowIcon');
            
            panelBody.style.display = 'block';
            arrow.style.transform = 'rotate(0deg)';
        }

        // Render Recent Reports List in Bottom Panel
        function renderReportsUI() {
            const container = document.getElementById('recentPanelBody');
            const countBadge = document.getElementById('reportCountBadge');
            
            countBadge.innerText = reportsData.length;
            container.innerHTML = '';

            if (reportsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-6 text-gray-400 text-xs">
                        කිසිදු මෑත කාලීන වාර්තාවක් නොමැත.
                    </div>
                `;
                return;
            }

            reportsData.forEach(item => {
                const formattedTime = formatDateTime12H(item.timestamp);
                
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-2xl p-3.5 shadow-sm hover:shadow-md transition space-y-2.5";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="bg-red-50 text-red-600 text-xs font-bold px-2 py-0.5 rounded-full flex items-center gap-1 border border-red-200">
                                <i class="fa-solid fa-triangle-exclamation"></i> ${item.severity}
                            </span>
                            <span class="bg-gray-100 text-gray-600 text-[11px] font-medium px-2 py-0.5 rounded-full flex items-center gap-1">
                                <i class="fa-solid fa-hourglass-half text-amber-500"></i> ${item.distanceTime}
                            </span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="editReport('${item.id}')" class="p-1.5 text-gray-400 hover:text-blue-600 rounded-lg transition" title="වෙනස් කරන්න">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteReport('${item.id}')" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg transition" title="මකන්න">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-start justify-between">
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.locationName}</h4>
                            <p class="text-xs text-gray-500 flex items-center gap-1 mt-0.5">
                                <i class="fa-regular fa-clock text-emerald-600"></i>
                                <span class="font-mono">${formattedTime}</span>
                            </p>
                        </div>
                        <button onclick="focusOnMap(${item.lat}, ${item.lng})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-xl flex items-center gap-1 transition">
                            <i class="fa-solid fa-location-crosshairs"></i> සිතියම
                        </button>
                    </div>

                    <div class="flex items-center justify-between text-xs text-gray-600 bg-gray-50 p-2 rounded-xl">
                        <span>අලි ගණන: <strong class="text-gray-900">${item.count}</strong></span>
                        <span>දිශාව: <strong class="text-emerald-800">${item.direction}</strong></span>
                        <span>වාර්තාකරු: <strong class="text-gray-900">${item.reporterName}</strong></span>
                    </div>

                    ${item.facebookPosts && item.facebookPosts.length > 0 ? `
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            ${item.facebookPosts.map(fb => `
                                <a href="${fb.link}" class="flex items-center space-x-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 p-1.5 rounded-xl text-[11px] font-medium transition truncate">

                                    <span class="truncate">${fb.title}</span>

                `;

                container.appendChild(card);
            });
        }

        function focusOnMap(lat, lng) {
            map.setView([lat, lng], 15, { animate: true });
            collapseRecentPanel();
        }

        function recenterMap() {
            if (reportsData.length > 0) {
                map.setView([reportsData[0].lat, reportsData[0].lng], 13);
            } else {
                map.setView([8.0325, 80.7512], 13);
            }
        }

        // Modal Operations
        function openAddModal() {
            document.getElementById('reportId').value = '';
            document.getElementById('modalTitle').innerText = 'නව අලි වාර්තාවක් ඇතුළත් කිරීම';
            document.getElementById('reportForm').reset();
            
            // Set default lat/lng
            const center = map.getCenter();
            document.getElementById('formLat').value = center.lat.toFixed(6);
            document.getElementById('formLng').value = center.lng.toFixed(6);
            
            document.getElementById('reportModal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
        }

        function editReport(id) {
            const item = reportsData.find(r => r.id === id);
            if (!item) return;

            document.getElementById('reportId').value = item.id;
            document.getElementById('modalTitle').innerText = 'වාර්තාව වෙනස් කිරීම';
            document.getElementById('formLocationName').value = item.locationName;
            document.getElementById('formReporterName').value = item.reporterName;
            document.getElementById('formLat').value = item.lat;
            document.getElementById('formLng').value = item.lng;
            document.getElementById('formCount').value = item.count;
            document.getElementById('formDirection').value = item.direction;
            document.getElementById('formSeverity').value = item.severity;

            document.getElementById('reportModal').classList.remove('hidden');
        }

        function deleteReport(id) {
            if (confirm('මෙම වාර්තාව සැබවින්ම මකා දැමීමට අවශ්‍යද?')) {
                reportsData = reportsData.filter(r => r.id !== id);
                renderMarkers();
                renderReportsUI();
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('reportId').value;
            const locationName = document.getElementById('formLocationName').value;
            const reporterName = document.getElementById('formReporterName').value;
            const lat = parseFloat(document.getElementById('formLat').value);
            const lng = parseFloat(document.getElementById('formLng').value);
            const count = parseInt(document.getElementById('formCount').value);
            const direction = document.getElementById('formDirection').value;
            const severity = document.getElementById('formSeverity').value;

            if (id) {
                // Update existing
                const index = reportsData.findIndex(r => r.id === id);
                if (index !== -1) {
                    reportsData[index] = {
                        ...reportsData[index],
                        locationName,
                        reporterName,
                        lat,
                        lng,
                        count,
                        direction,
                        severity
                    };
                }
            } else {
                // Create new
                const newItem = {
                    id: Date.now().toString(),
                    locationName,
                    reporterName,
                    timestamp: new Date().toISOString(),
                    count,
                    direction,
                    severity,
                    distanceTime: 'දැන්',
                    lat,
                    lng,
                    facebookPosts: []
                };
                reportsData.unshift(newItem);
            }

            renderMarkers();
            renderReportsUI();
            closeReportModal();

            // Pan to newly created/updated location
            map.setView([lat, lng], 14);
        }

        function toggleFiltersModal() {
            alert('පෙරහන් මෙනුව සක්‍රීයයි');
        }
    </script>
</body>
</html>
