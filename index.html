<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elephant Watch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, textarea, button {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Elephant Watch - වාර්තාවක් එකතු කරන්න</h2>
    <form id="reportForm">
        <label for="location">ස්ථානය:</label>
        <input type="text" id="location" required placeholder="ස්ථානය ඇතුළත් කරන්න">

        <label for="description">විස්තරය:</label>
        <textarea id="description" rows="4" required placeholder="සිදුවීම විස්තර කරන්න"></textarea>

        <button type="submit">වාර්තාව යවන්න</button>
    </form>
</div>

<!-- Firebase SDK v12 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // ඔබේ Firebase වින්‍යාසය
    const firebaseConfig = {
      apiKey: "AIzaSyCQiW0rOeuWwp3-h4ip37PcsUT-HoIhXg4",
      authDomain: "elipent-4e589.firebaseapp.com",
      projectId: "elipent-4e589",
      storageBucket: "elipent-4e589.firebasestorage.app",
      messagingSenderId: "363464948428",
      appId: "1:363464948428:web:e23f81df54b13003eee069",
      measurementId: "G-8D4RDL6G4F"
    };

    // Firebase සහ Firestore ආරම්භ කිරීම
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // ෆෝම් එක සබ්මිට් වන විට ක්‍රියාත්මක වීම
    const form = document.getElementById('reportForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const locationVal = document.getElementById('location').value;
        const descriptionVal = document.getElementById('description').value;

        try {
            const docRef = await addDoc(collection(db, "reports"), {
                location: locationVal,
                description: descriptionVal,
                timestamp: new Date()
            });
            alert("වාර්තාව සාර්ථකව සුරකින ලදී!");
            form.reset();
        } catch (error) {
            alert("දෝෂයයි: " + error.message);
            console.error("Error adding document: ", error);
        }
    });
</script>

</body>
</html>
