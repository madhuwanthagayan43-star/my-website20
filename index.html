<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මැප් සහ Full-Screen විස්තර</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* සාමාන්‍ය Leaflet Popup ස්ටෑන්ඩර්ඩ් එක */
        .leaflet-popup {
            pointer-events: none !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            pointer-events: auto !important;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .leaflet-popup-content {
            pointer-events: auto !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            pointer-events: auto !important;
            color: #d9534f;
        }

        /* මැප් එක සම්පූර්ණයෙන්ම පසුබිමෙන් වසා දමන Full-Screen පිටුව (Modal) */
        #fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 99999;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        #fullscreen-modal.active {
            display: flex;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .modal-close-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        /* යටින් ඇති මෑත කාලීන වාර්තා Bottom Sheet එක */
        #bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }
        .sheet-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 16px;
        }
        .sheet-content {
            padding: 15px 20px;
            overflow-y: auto;
            display: none;
        }
        #bottom-sheet.expanded .sheet-content {
            display: block;
        }
    </style>
</head>
<body>

    <!-- සිතියම පෙන්වන ප්‍රදේශය -->
    <div id="map"></div>

    <!-- පොප්-අප් එක ටච් කළ විට මුළු තිරයම ආවරණය කරමින් මතුවන Full-Screen පිටුව -->
    <div id="fullscreen-modal">
        <div class="modal-header">
            <h2 style="margin: 0; color: #d9534f;">⚠️ ස්ථාන අවදානම් විස්තර</h2>
            <button class="modal-close-btn" onclick="closeFullscreenModal()">ආපසු</button>
        </div>
        <div style="font-size: 16px; line-height: 1.6;">
            <p><strong>වාර්තාකරු:</strong> ගයාන්</p>
            <p><strong>දිනය/වේලාව:</strong> 2026/10/05 05:43 PM</p>
            <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
            <p><strong>ස්ථානයේ විස්තරය:</strong><br>සිරිපාලගම</p>
            <p><strong>අලි ගණන:</strong> 1</p>
            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button style="flex: 1; padding: 12px; background: #f0f0f0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">වෙනස් කරන්න</button>
                <button style="flex: 1; padding: 12px; background: #d9534f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">මකන්න</button>
            </div>
        </div>
    </div>

    <!-- මෑත කාලීන වාර්තා Bottom Sheet එක -->
    <div id="bottom-sheet">
        <div class="sheet-header" onclick="toggleBottomSheet()">
            <span>🕒 මෑත කාලීන වාර්තා</span>
            <span id="toggle-icon">▲</span>
        </div>
        <div class="sheet-content">
            <p><strong>ස්ථානය:</strong> සිරිපාලගම</p>
            <p>දිනය: 2026/10/05 05:43 PM</p>
            <p>අලි ගණන: 1</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // සිතියම ආරම්භ කිරීම (ශ්‍රී ලංකාව මධ්‍ය කරමින්)
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8731, 80.7718], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // සිතියම මත පොයින්ට් එකක් එක් කිරීම
        const marker = L.marker([7.95, 80.85]).addTo(map);

        const popupContent = `
            <div id="popup-inner-box" style="min-width: 200px;">
                <h3 style="margin: 0 0 10px 0; color: #d9534f; font-size: 14px;">⚠️ ස්ථාන අවදානම්</h3>
                <p style="margin: 5px 0;"><strong>වාර්තාකරු:</strong> ගයාන්</p>
                <p style="margin: 5px 0;"><strong>දිනය/වේලාව:</strong> 2026/10/05 05:43 PM</p>
                <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
                <p style="margin: 5px 0;"><strong>ස්ථානයේ විස්තරය:</strong><br>සිරිපාලගම</p>
                <p style="margin: 5px 0;"><strong>අලි ගණන:</strong> 1</p>
                <div style="margin-top: 10px; display: flex; gap: 5px;">
                    <button style="flex: 1; padding: 6px; background: #f0f0f0; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">වෙනස්</button>
                    <button style="flex: 1; padding: 6px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation();">මකන්න</button>
                </div>
            </div>
        `;

        marker.bindPopup(popupContent, {
            autoPan: false,
            closeOnClick: false,
            autoClose: false
        });

        // පොප්-අප් එක විවෘත වූ පසු ටච් සහ ඩ්‍රැග් පාලනය කිරීම
        marker.on('popupopen', function(e) {
            const innerBox = document.getElementById('popup-inner-box');

            let startX = 0, startY = 0;
            let isDragging = false;
            let touchStartTime = 0;

            innerBox.addEventListener('touchstart', function(event) {
                startX = event.touches[0].clientX;
                startY = event.touches[0].clientY;
                isDragging = false;
                touchStartTime = new Date().getTime();
            }, { passive: true });

            innerBox.addEventListener('touchmove', function(event) {
                let moveX = event.touches[0].clientX;
                let moveY = event.touches[0].clientY;
                
                // ඇඟිල්ල ටිකක් හෝ ඈතට ගෙනයනවා නම් ඩ්‍රැග් ලෙස සලකා මැප් එක ඩ්‍රැග් වීමට ඉඩ හැරීම
                if (Math.abs(moveX - startX) > 5 || Math.abs(moveY - startY) > 5) {
                    isDragging = true;
                    map.dragging._draggable._onDown(event);
                }
            }, { passive: true });

            innerBox.addEventListener('touchend', function(event) {
                let touchDuration = new Date().getTime() - touchStartTime;
                
                // ඩ්‍රැග් කර නැතිනම් සහ ඉක්මනින් ටච් කර අතහැරියා නම් පමණක් Full Screen Page එක පෙන්වීම
                if (!isDragging && touchDuration < 300) {
                    if (event.target.tagName !== 'BUTTON') {
                        document.getElementById('fullscreen-modal').classList.add('active');
                        map.closePopup(); // පොප්-අප් එක වසා දැමීම
                    }
                }
            });
        });

        // Full Screen පිටුව වැසීම සඳහා
        function closeFullscreenModal() {
            document.getElementById('fullscreen-modal').classList.remove('active');
        }

        // Bottom Sheet එක ඉහළට/පහළට හැසිරවීම සහ පොප්-අප් එක වැසීම
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const icon = document.getElementById('toggle-icon');
            sheet.classList.toggle('expanded');
            
            if (sheet.classList.contains('expanded')) {
                icon.textContent = '▼';
                map.closePopup();
            } else {
                icon.textContent = '▲';
            }
        }
    </script>
</body>
</html>
