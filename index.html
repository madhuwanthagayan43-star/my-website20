    <script>
        let map;
        const markers = {};
        let currentSheetState = 'normal'; // 'hidden', 'normal', 'fullscreen'

        // Initializing Map & Setup on Window Load
        window.onload = function() {
            initMap();
            setupDragHandleGesture();
        };

        function initMap() {
            // Center near Sigiriya / Habarana elephant hotspot region
            const defaultCoords = [7.8731, 80.7718];
            
            map = L.map('map', {
                zoomControl: false
            }).setView(defaultCoords, 13);

            // Satellite Tiles with Labels
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri, Maxar, Earthstar Geographics',
                maxZoom: 18
            }).addTo(map);

            // Additional Labels overlay
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
                maxZoom: 18,
                subdomains: 'abcd'
            }).addTo(map);

            // Add Custom Elephant Markers with Popup Forms
            createElephantMarker('report-1', 7.8731, 80.7718, 'අලියෙක් දක්නා ලදී', '1', 'ගයාන්', '2026/10/05 10:36 AM');
            createElephantMarker('report-2', 7.8950, 80.7500, 'අලි රංචුවක් ගමට ආසන්නයේ', '4', 'නිමල්', '2026/10/05 09:15 AM');
        }

        function createElephantMarker(id, lat, lng, title, count, reporter, timeStr) {
            // Custom HTML Icon with Pulsing Effect
            const customIcon = L.divIcon({
                className: 'custom-elephant-icon',
                html: `
                    <div class="relative flex items-center justify-center">
                        <div class="marker-pulse"></div>
                        <div class="w-10 h-10 rounded-full bg-red-600 border-2 border-white shadow-xl flex items-center justify-center text-white text-lg font-bold">
                            🐘
                        </div>
                    </div>
                `,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);

            // Leaflet Popup Form in Sinhala
            const popupContent = `
                <div class="text-gray-800 font-sans">
                    <div class="flex items-center justify-between border-b pb-2 mb-2">
                        <span class="font-bold text-emerald-700 text-sm">නව වාර්තාවක්</span>

                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs font-semibold text-gray-600 block">අලි ගණන</label>
                                <div class="bg-gray-100 p-1.5 rounded text-xs font-bold text-center text-emerald-800">${count}</div>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600 block">වාර්තාකරු</label>
                                <div class="bg-gray-100 p-1.5 rounded text-xs text-center">${reporter}</div>
                            </div>

                            <i class="fa-solid fa-circle-check mr-1"></i> තහවුරු කරන්න
                        </button>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
            markers[id] = marker;
        }

        function setSheetState(state) {
            currentSheetState = state;
            const sheet = document.getElementById('bottom-sheet');
            const closeBtn = document.getElementById('fullscreen-close-btn');

            // Reset classes
            sheet.classList.remove('sheet-hidden', 'sheet-normal', 'sheet-fullscreen');

            if (state === 'hidden') {
                sheet.classList.add('sheet-hidden');
                closeBtn.classList.add('hidden');
            } else if (state === 'normal') {
                sheet.classList.add('sheet-normal');
                closeBtn.classList.add('hidden');
            } else if (state === 'fullscreen') {
                sheet.classList.add('sheet-fullscreen');
                closeBtn.classList.remove('hidden');
            }
        }

        // Handle Report Card Click Event: Hide Bottom Sheet, Pan Map, Open Marker Popup
        function onReportCardClick(reportId, lat, lng) {
            // 1. Transition Sheet to Hidden State (Collapsed at bottom)
            setSheetState('hidden');

            // 2. Fly/Pan map to clicked report location
            map.flyTo([lat, lng], 15, {
                duration: 1.2
            });

            // 3. Open the marker popup form after slight delay for smooth panning
            setTimeout(() => {
                const targetMarker = markers[reportId];
                if (targetMarker) {
                    targetMarker.openPopup();
                }
            }, 600);
        }

        // Strict Drag Handle Gesture Logic for Swiping between Hidden <-> Normal <-> Fullscreen
        function setupDragHandleGesture() {
            const dragHandleBar = document.getElementById('drag-handle-bar');
            const dragHandleZone = document.getElementById('drag-handle-zone');
            
            let startY = 0;
            let currentY = 0;
            let isDragging = false;

            // Target strictly the handle bar & its immediate zone
            const handleTargets = [dragHandleBar, dragHandleZone];

            handleTargets.forEach(target => {
                // Touch Events
                target.addEventListener('touchstart', (e) => {
                    startY = e.touches[0].clientY;
                    isDragging = true;
                }, { passive: true });

                target.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    currentY = e.touches[0].clientY;
                }, { passive: true });

                target.addEventListener('touchend', () => {
                    if (!isDragging) return;
                    isDragging = false;
                    handleSwipeGesture(startY, currentY);
                });

                // Mouse Events for Desktop Testing
                target.addEventListener('mousedown', (e) => {
                    startY = e.clientY;
                    isDragging = true;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    currentY = e.clientY;
                });

                window.addEventListener('mouseup', () => {
                    if (!isDragging) return;
                    isDragging = false;
                    handleSwipeGesture(startY, currentY);
                });
            });
        }

        function handleSwipeGesture(startY, endY) {
            const deltaY = startY - endY; // Positive = Swipe Up, Negative = Swipe Down
            const threshold = 40; // minimum drag distance in px

            if (Math.abs(deltaY) < threshold) return;

            if (deltaY > 0) {
                // SWIPE UP
                if (currentSheetState === 'hidden') {
                    setSheetState('normal');
                } else if (currentSheetState === 'normal') {
                    setSheetState('fullscreen');
                }
            } else {
                // SWIPE DOWN
                if (currentSheetState === 'fullscreen') {
                    setSheetState('normal');
                } else if (currentSheetState === 'normal') {
                    setSheetState('hidden');
                }
            }
        }

        function centerUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.flyTo([lat, lng], 14);
                }, () => {
                    map.flyTo([7.8731, 80.7718], 13);
                });
            }
        }
    </script>
